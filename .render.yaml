services:
  - type: web
    name: symfony-app
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: symfony-db
          property: connectionString

databases:
  - name: symfony-db
    databaseName: symfony_db
    user: symfony_user
